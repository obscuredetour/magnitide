# Open Library as a Magnitide plugin: the example of a metadata source
# written against the plugin API (docs/plugin-api.md). Its own workspace.
[package]
name = "openlibrary-source"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
magnitide-plugin-sdk = { path = "../../crates/plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]

[profile.release]
opt-level = "s"
strip = true
