[package]
name = "magnitide-sources"
version = "0.1.0"
edition = "2024"
description = "Book metadata lookup from online sources (Open Library, Google Books), on request only"
license = "GPL-3.0-or-later"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
magnitide-catalog = { version = "0.1.0", path = "../catalog" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ts-rs = { version = "12.0.1", optional = true }
ureq = "3"

[dev-dependencies]
tempfile = "3.27.0"

[features]
# Export TypeScript bindings for UI-facing types (used by the app).
ts = ["dep:ts-rs", "magnitide-catalog/ts"]
