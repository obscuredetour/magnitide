[package]
name = "magnitide"
version.workspace = true
edition = "2024"
description = "A fast ebook library manager that works with your calibre library"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
ammonia = "4.2.1"
anyhow = "1.0.104"
calibre-compat = { path = "../calibre-compat" }
magnitide-catalog = { path = "../catalog", features = ["ts"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
open = "5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = { version = "2", default-features = false }
ts-rs = "12.0.1"
magnitide-core = { path = "../core", features = ["ts"] }
magnitide-sources = { path = "../sources", features = ["ts"] }
magnitide-server = { path = "../server" }
magnitide-plugins = { path = "../plugins", features = ["ts"] }
magnitide-plugins-wasm = { path = "../plugins-wasm", features = ["ts"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
trash = "5.2.9"

[build-dependencies]
tauri-build = { version = "2", features = [] }
