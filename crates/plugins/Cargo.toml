[package]
name = "magnitide-plugins"
version = "0.1.0"
edition = "2024"
description = "Runs calibre plugins in the user's installed calibre, for Magnitide"
license = "GPL-3.0-or-later"

[dependencies]
base64 = "0.22.1"
calibre-compat = { version = "0.1.0", path = "../calibre-compat" }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
magnitide-catalog = { version = "0.1.0", path = "../catalog" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
magnitide-sources = { version = "0.1.0", path = "../sources" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ts-rs = { version = "12.0.1", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[features]
# Export TypeScript bindings for UI-facing types (used by the app).
ts = ["dep:ts-rs", "magnitide-sources/ts"]
