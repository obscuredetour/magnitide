[package]
name = "magnitide-plugins"
version.workspace = true
edition = "2024"
description = "Runs calibre plugins in Magnitide's own plugin runtime"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
base64 = "0.22.1"
include_dir = "0.7.4"
calibre-compat = { path = "../calibre-compat" }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
magnitide-catalog = { path = "../catalog" }
magnitide-core = { path = "../core" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
magnitide-sources = { path = "../sources" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tar = "0.4.44"
ts-rs = { version = "12.0.1", optional = true }
ureq = "3"
zstd = "0.13"
liblzma = { version = "0.4", features = ["static"] }

[build-dependencies]
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3.27.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[features]
# Export TypeScript bindings for UI-facing types (used by the app).
ts = ["dep:ts-rs", "magnitide-sources/ts"]
