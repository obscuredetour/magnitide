[package]
name = "magnitide-core"
version = "0.1.0"
edition = "2024"
description = "The Magnitide library: native schema, migrations, queries, edits and import"
license = "GPL-3.0-or-later"

[features]
# Export TypeScript bindings for UI-facing types (used by the app).
ts = ["dep:ts-rs"]

[dependencies]
ammonia = "4.2.1"
calibre-compat = { version = "0.1.0", path = "../calibre-compat" }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
magnitide-catalog = { version = "0.1.0", path = "../catalog" }
reflink-copy = "0.1.30"
roxmltree = "0.21.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
ts-rs = { version = "12.0.1", optional = true }
uuid = { version = "1.27.0", features = ["v4"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
libc = "0.2.190"
