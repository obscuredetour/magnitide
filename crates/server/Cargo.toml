[package]
name = "magnitide-server"
version = "0.1.0"
edition = "2024"
description = "Serves a library on the local network: an OPDS catalogue for reading apps and a plain web page for e-reader browsers (read-only)"
license = "GPL-3.0-or-later"

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
if-addrs = "0.15.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
magnitide-catalog = { version = "0.1.0", path = "../catalog" }
magnitide-core = { version = "0.1.0", path = "../core" }
tiny_http = "0.12"

[dev-dependencies]
roxmltree = "0.21.1"
tempfile = "3.27.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
