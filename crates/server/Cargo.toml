[package]
name = "magnitide-server"
version.workspace = true
edition = "2024"
description = "Serves a library on the local network: an OPDS catalogue for reading apps and a plain web page for e-reader browsers (read-only)"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
if-addrs = "0.15.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
magnitide-catalog = { path = "../catalog" }
magnitide-core = { path = "../core" }
md-5 = "0.11.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tiny_http = "0.12"

[dev-dependencies]
roxmltree = "0.21.1"
tempfile = "3.27.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
