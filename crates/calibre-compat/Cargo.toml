[package]
name = "calibre-compat"
version.workspace = true
edition = "2024"
description = "Prototype: read an existing calibre library (metadata.db) natively in Rust"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
magnitide-catalog = { path = "../catalog" }
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.27.0", features = ["v4"] }

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
libc = "0.2.190"

