[package]
name = "magnitide-catalog"
version = "0.1.0"
edition = "2024"
description = "In-memory book catalog shared by every library kind: model, search and sort"
license = "GPL-3.0-or-later"

[features]
# Export TypeScript bindings for UI-facing types (used by the app).
ts = ["dep:ts-rs"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
deunicode = "1.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strsim = "0.11"
ts-rs = { version = "12.0.1", optional = true }
