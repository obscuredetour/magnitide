# Builds the plugin runtime (CPython + PyQt6 + wheels, see
# scripts/plugin-runtime/README.md) for every target and attaches the
# archives to the GitHub release `plugin-runtime-v<VERSION>`, with
# manifest.json and sha256sums.txt. Magnitide downloads an archive on
# request and installs it only if its hash matches the one compiled into
# the app (`RELEASES` in crates/plugins/src/runtime.rs), so after a release:
#   python3 scripts/plugin-runtime/build.py --rust-table manifest.json
# paste the table into runtime.rs, commit sha256sums.txt, and ship Magnitide.
#
# Run by hand (workflow_dispatch) or by pushing a tag `plugin-runtime-v<N>`,
# where N is scripts/plugin-runtime/VERSION.
name: Plugin runtime

on:
  workflow_dispatch:
  push:
    tags: ["plugin-runtime-v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-2022, target: x86_64-pc-windows-msvc }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/plugin-runtime-v')
        shell: bash
        run: |
          v="$(cat scripts/plugin-runtime/VERSION | tr -d '[:space:]')"
          test "refs/tags/plugin-runtime-v$v" = "$GITHUB_REF" || { echo "VERSION is $v but the tag is $GITHUB_REF"; exit 1; }
      - name: Qt's platform libraries, for the smoke test
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbcommon-x11-0 libegl1 libgl1 libfontconfig1 libdbus-1-3 libglib2.0-0
      - name: Build
        shell: bash
        run: python3 scripts/plugin-runtime/build.py --target ${{ matrix.target }} --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-runtime-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: plugin-runtime-*
          path: dist
          merge-multiple: true
      - name: Manifest and checksums
        run: |
          python3 scripts/plugin-runtime/build.py --manifest dist --sha256sums dist/sha256sums.txt
          cat dist/sha256sums.txt
          echo; echo "RELEASES table for crates/plugins/src/runtime.rs:"; echo
          python3 scripts/plugin-runtime/build.py --rust-table dist/manifest.json
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(cat scripts/plugin-runtime/VERSION | tr -d '[:space:]')"
          tag="plugin-runtime-v$v"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Plugin runtime $v" --notes "Magnitide's plugin runtime, version $v (see scripts/plugin-runtime/README.md). Magnitide downloads the archive for its platform on request." --target "$GITHUB_SHA"
          fi
          gh release upload "$tag" dist/*.tar.zst dist/*.tar.zst.json dist/manifest.json dist/sha256sums.txt --clobber
