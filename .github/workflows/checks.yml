# Runs on every push to main and every pull request: Rust formatting, lints
# and tests, and the UI's type check, formatting and release build. Linux
# only (the cheapest runner); a newer push cancels the run it replaces.
# Draft pull requests wait until they're marked ready for review, and changes
# that only touch documentation don't run at all.
# The runner is pinned (not ubuntu-latest) so a new Ubuntu, and the
# WebKitGTK packages Tauri builds against, arrive when we choose.
name: Checks

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    # ready_for_review: a draft's first run, once it's marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["**.md", "docs/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (format, clippy, tests)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: System libraries Tauri builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-wasip2  # the test plugin (a WebAssembly component) is built by the tests
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The plugin host tests need the published plugin runtime (CPython +
      # PyQt6), which the first release of it makes available: until
      # sha256sums.txt exists they're skipped. With it, Qt runs under xvfb.
      - name: Cache the plugin runtime download
        if: hashFiles('scripts/plugin-runtime/sha256sums.txt') != ''
        uses: actions/cache@v4
        with:
          path: target/plugin-runtime/downloads
          key: plugin-runtime-${{ hashFiles('scripts/plugin-runtime/sha256sums.txt') }}
      - name: Plugin runtime
        id: runtime
        if: hashFiles('scripts/plugin-runtime/sha256sums.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}  # fetch.sh downloads the release through gh while the repository is private
        run: |
          sudo apt-get install -y --no-install-recommends zstd xvfb libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libegl1 libgl1 libfontconfig1 libdbus-1-3 libglib2.0-0
          scripts/plugin-runtime/fetch.sh
          echo "MAGNITIDE_PLUGIN_RUNTIME=$PWD/target/plugin-runtime/current" >> "$GITHUB_ENV"
          echo "MAGNITIDE_COMPAT_DIR=$PWD/crates/plugins/python" >> "$GITHUB_ENV"
          echo "MAGNITIDE_REQUIRE_PLUGIN_RUNTIME=1" >> "$GITHUB_ENV"
      - run: xvfb-run -a cargo test --workspace
      # The example plugin and the template build and pack (the SDK changes with them).
      - name: Plugins build
        run: |
          scripts/build-plugin.sh plugins/openlibrary-source
          scripts/build-plugin.sh plugins/template
          cargo run -q -p magnitide-plugins-wasm --bin mgp -- check target/plugins/my-plugin.mgp
      # The same host tests inside an installed calibre (the oracle for the
      # compat package): calibre's own Linux build, isolated in the runner.
      - name: Install calibre
        run: |
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxcb-cursor0 libxcb-xinerama0 libxkbcommon-x11-0 xvfb xz-utils
          mkdir -p "$HOME/calibre-bin"
          wget -nv -O- https://download.calibre-ebook.com/linux-installer.sh | sh /dev/stdin install_dir="$HOME/calibre-bin" isolated=y
          echo "$HOME/calibre-bin/calibre" >> "$GITHUB_PATH"
          "$HOME/calibre-bin/calibre/calibre-debug" --version
      - name: Host tests inside calibre
        env:
          MAGNITIDE_PLUGIN_HOST: calibre
          MAGNITIDE_COMPAT_DIR: ${{ github.workspace }}/crates/plugins/python
        run: xvfb-run -a cargo test -p magnitide-plugins --test host
      # The tests regenerate the UI's TypeScript bindings (ts-rs); they must be committed.
      - name: TypeScript bindings are up to date
        run: git diff --exit-code -- crates/app/ui/src/bindings

  ui:
    name: UI (types, formatting, build)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: crates/app/ui
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: crates/app/ui/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: crates/app/ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec vite build

  python:
    name: Python (plugin compat package)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - name: Dependencies (the runtime's wheels, and the test tools)
        run: |
          uv venv --python 3.14 .venv
          uv pip install --python .venv --requirement scripts/plugin-runtime/requirements.txt --require-hashes
          uv pip install --python .venv --requirement crates/plugins/python-tests/requirements-dev.txt
      - run: .venv/bin/ruff check crates/plugins/python crates/plugins/python-tests crates/plugins/tests/fixtures scripts
      - run: .venv/bin/ruff format --check crates/plugins/python crates/plugins/python-tests
      - name: Tests
        run: |
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libdbus-1-3
          QT_QPA_PLATFORM=offscreen .venv/bin/python -m pytest crates/plugins/python-tests -q
